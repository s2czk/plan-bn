name: Testy projektu

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, final-plan-parser-push]
    paths:
      - 'updater.py'
      - '.github/workflows/update_schedule.yml'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'audit_plan.py'
      - 'push_dispatch.py'
      - 'requirements.txt'
      - 'index.html'
      - 'sw.js'
      - 'cloudflare/**'
      - 'tests/**'
      - 'push-config.js'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Przygotuj Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Przygotuj Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'

      - name: Zainstaluj zależności Pythona
        run: python -m pip install -r requirements.txt

      - name: Sprawdź składnię skryptów Python
        run: python -m compileall -q updater.py audit_plan.py push_dispatch.py tests

      - name: Uruchom testy jednostkowe
        run: python -m unittest discover -s tests -v

      - name: Pełny audyt źródłowego PDF i porównanie z opublikowanymi danymi
        run: python audit_plan.py

      - name: Ustaw przypiętą wersję npm
        run: npm install --global npm@12.2.3

      - name: Wygeneruj package-lock, jeśli jeszcze go nie ma
        working-directory: cloudflare
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Zainstaluj deterministyczne zależności Cloudflare
        working-directory: cloudflare
        run: npm ci --no-audit --no-fund

      - name: Testy API Cloudflare Worker
        working-directory: cloudflare
        run: npm test

      - name: Sprawdź składnię i zbuduj Worker (dry run)
        working-directory: cloudflare
        run: |
          node --check src/index.js
          npx wrangler deploy --dry-run --outdir ./.test-build

      - name: Sprawdź składnię Service Worker i wersje
        run: |
          node --check sw.js
          node --version
          npm --version
          python --version

      - name: Zapisz package-lock jako artefakt audytu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-package-lock
          path: cloudflare/package-lock.json
          if-no-files-found: warn
          retention-days: 7
