name: Testy projektu

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, final-plan-parser-push]
    paths:
      - 'updater.py'
      - 'requirements.txt'
      - 'index.html'
      - 'sw.js'
      - 'cloudflare/**'
      - 'tests/**'
      - 'push-config.js'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Przygotuj Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zainstaluj zależności Pythona
        run: python -m pip install -r requirements.txt

      - name: Uruchom testy
        run: python -m unittest discover -s tests -v

      - name: Zainstaluj narzędzia Cloudflare
        working-directory: cloudflare
        run: npm install --no-audit --no-fund

      - name: Testy API Cloudflare Worker
        working-directory: cloudflare
        run: npm test

      - name: Sprawdź składnię i zbuduj Worker (dry run)
        working-directory: cloudflare
        run: |
          node --check src/index.js
          npx wrangler deploy --dry-run --outdir ./.test-build

      - name: Sprawdź składnię Service Worker
        run: node --check sw.js
