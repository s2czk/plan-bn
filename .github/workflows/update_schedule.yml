name: Aktualizacja Planu BN1 PANS

on:
  schedule:
    # Uruchamia się automatycznie co godzinę między 06:00 a 20:00
    - cron: '0 6-20 * * *'
  workflow_dispatch: # Pozwala też kliknąć "Run workflow" ręcznie w każdej chwili

permissions:
  contents: write

jobs:
  update-schedule:
    # Stała wersja systemu, aby uniknąć automatycznej migracji ubuntu-latest
    runs-on: ubuntu-24.04

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Zainstaluj Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Zainstaluj biblioteki do czytania PDF i strony PANS
        run: python -m pip install --upgrade pip requests beautifulsoup4 pdfplumber

      - name: Sprawdź stronę PANS i przetwórz PDF
        run: python updater.py

      - name: Zapisz zaktualizowany plan w repozytorium
        run: |
          git config user.name "PANS-Schedule-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.json last_hash.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizacja planu BN1 PANS" && git push)
