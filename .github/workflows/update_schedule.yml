name: Aktualizacja planu zajęć BN — PANS Koszalin

on:
  push:
    branches: [main]
    paths:
      - 'updater.py'
      - 'tests/**'
      - '.github/workflows/update_schedule.yml'
  schedule:
    - cron: '0 6-20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pans-schedule
  cancel-in-progress: false

jobs:
  update-schedule:
    runs-on: ubuntu-24.04
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Przygotuj Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Zainstaluj zależności
        run: python -m pip install --upgrade pip requests beautifulsoup4 pdfplumber

      - name: Testy parsera i detekcji zmian
        run: python -m unittest discover -s tests -v

      - name: Pobierz i przetwórz aktualny plan PDF
        run: python updater.py

      - name: Zapisz plan i powiadomienia
        run: |
          git config user.name "PANS-Schedule-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.json last_hash.txt notifications.json
          git diff --cached --quiet || (git commit -m "Aktualizacja planu zajęć PANS" && git push)
