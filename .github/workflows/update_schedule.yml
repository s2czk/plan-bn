name: Aktualizacja planu zajęć BN — PANS Koszalin

on:
  push:
    branches: [main]
    paths:
      - 'updater.py'
      - 'requirements.txt'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'push-config.js'
      - 'cloudflare/**'
      - 'tests/**'
      - '.github/workflows/update_schedule.yml'
  schedule:
    - cron: '0 6-23 * * *'
      timezone: 'Europe/Warsaw'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pans-schedule
  cancel-in-progress: false

jobs:
  update-schedule:
    runs-on: ubuntu-24.04
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Przygotuj Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Zainstaluj zależności
        run: python -m pip install -r requirements.txt

      - name: Testy parsera i detekcji zmian
        run: python -m unittest discover -s tests -v

      - name: Pobierz i przetwórz aktualny plan PDF
        run: python updater.py

      - name: Wyślij powiadomienia Push (gdy Cloudflare jest skonfigurowany)
        env:
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_DISPATCH_TOKEN: ${{ secrets.PUSH_DISPATCH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          worker = os.environ.get("PUSH_WORKER_URL", "").strip().rstrip("/")
          token = os.environ.get("PUSH_DISPATCH_TOKEN", "").strip()
          payload = json.loads(Path("push_payload.json").read_text(encoding="utf-8"))
          notifications = payload.get("notifications", [])

          if not worker or not token:
              print("Cloudflare Push nie jest jeszcze skonfigurowany — pomijam wysyłkę.")
              raise SystemExit(0)
          # Wykonuj autoryzowany test /dispatch przy każdym uruchomieniu.
          # Pusta tablica jest bezpieczna: Worker sprawdza token i konfigurację,
          # ale nie wysyła żadnego powiadomienia na urządzenia.
          body = json.dumps({"notifications": notifications}, ensure_ascii=False).encode("utf-8")
          last_error = None
          for attempt in range(3):
              request = urllib.request.Request(
                  worker + "/dispatch",
                  data=body,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                      "User-Agent": "PANS-Schedule-Updater/1.0 (+https://plan.mandaro.eu)",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      response_body = response.read().decode("utf-8")
                      print(response_body)
                      result = json.loads(response_body)
                      required_fields = {"notifications", "devices", "sent", "skipped", "removed", "failed"}
                      if not isinstance(result, dict) or not required_fields.issubset(result):
                          raise SystemExit("Cloudflare Push returned an unexpected response schema.")
                      if result["failed"]:
                          raise SystemExit(f"Cloudflare Push reported {result['failed']} delivery failures.")
                      if not notifications:
                          print("Brak nowych zmian — autoryzowany test Cloudflare Push zakończony poprawnie.")
                      elif result["sent"] == 0:
                          print("UWAGA: żadne powiadomienie nie zostało dostarczone; sprawdź liczbę urządzeń i usuniętych subskrypcji.")
                  break
              except urllib.error.HTTPError as error:
                  response_body = error.read().decode("utf-8", errors="replace")
                  response_headers = {
                      key: error.headers.get(key)
                      for key in ("server", "cf-ray", "cf-cache-status", "content-type")
                      if error.headers.get(key)
                  }
                  print(json.dumps({
                      "push_http_status": error.code,
                      "push_response_headers": response_headers,
                      "push_response_body": response_body[:2000],
                  }, ensure_ascii=False))
                  if 400 <= error.code < 500:
                      raise SystemExit(f"Push endpoint rejected the request (HTTP {error.code}); see response details above.")
                  last_error = error
                  if attempt < 2:
                      time.sleep(2 ** attempt)
              except Exception as error:
                  last_error = error
                  if attempt < 2:
                      time.sleep(2 ** attempt)
          else:
              raise SystemExit(f"Nie udało się wysłać Push po 3 próbach: {last_error}")
          PY

      - name: Zapisz plan, historię i wersję parsera
        run: |
          git config user.name "PANS-Schedule-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.json last_hash.txt parser_version.txt notifications.json
          if [ -f update_sequence.txt ]; then git add update_sequence.txt; fi
          git diff --cached --quiet || (git commit -m "Aktualizacja planu zajęć PANS" && git push)
