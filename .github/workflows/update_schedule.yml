name: Aktualizacja planu zajęć BN — PANS Koszalin

on:
  push:
    branches: [main]
    paths:
      - 'updater.py'
      - 'push_dispatch.py'
      - 'requirements.txt'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'push-config.js'
      - 'cloudflare/**'
      - 'tests/**'
      - '.github/workflows/update_schedule.yml'
  schedule:
    - cron: '0 6-23 * * *'
      timezone: 'Europe/Warsaw'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pans-schedule
  cancel-in-progress: false

jobs:
  update-schedule:
    runs-on: ubuntu-24.04
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Przygotuj Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Zainstaluj zależności
        run: python -m pip install -r requirements.txt

      - name: Testy parsera, detekcji zmian i kolejki Push
        run: python -m unittest discover -s tests -v

      - name: Pobierz i przetwórz aktualny plan PDF
        run: python updater.py

      # Najpierw publikujemy plan i zapisujemy kolejkę w repozytorium.
      # Awaria zewnętrznego Push nie może zatrzymać publikacji planu ani zgubić alertów.
      - name: Zapisz plan, historię i oczekujące powiadomienia
        run: |
          git config user.name "PANS-Schedule-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.json last_hash.txt parser_version.txt notifications.json pending_push.json
          if [ -f update_sequence.txt ]; then git add update_sequence.txt; fi
          git diff --cached --quiet || (git commit -m "Aktualizacja planu zajęć PANS" && git push)

      - name: Wyślij oczekujące powiadomienia Push
        env:
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_DISPATCH_TOKEN: ${{ secrets.PUSH_DISPATCH_TOKEN }}
        run: python push_dispatch.py

      - name: Zapisz potwierdzone dostarczenie Push
        run: |
          git config user.name "PANS-Schedule-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add pending_push.json
          git diff --cached --quiet || (git commit -m "Potwierdź dostarczenie powiadomień Push" && git push)
