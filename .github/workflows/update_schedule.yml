name: Aktualizacja Planu BN1 PANS

on:
  schedule:
    # Uruchamiaj co godzinę od 7:00 do 20:00 w dni robocze
    - cron: '0 7-20 * * 1-5'
  workflow_dispatch: # Pozwala na ręczne odpalenie przyciskiem

jobs:
  update-schedule:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber

      - name: Run updater script
        run: python updater.py

      - name: Commit and push if changes detected
        run: |
          git config --global user.name "ScheduleBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add schedule.json last_hash.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja planu zajęć" && git push)
